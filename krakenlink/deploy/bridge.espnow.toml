# Pi-side config for Transport B: air ESP32-S3 (MAC 7c:4f:ad:b6:a1:34, firmware env air_s3)
# plugged into the Pi by its "COM" USB port. The by-id path survives reboots and other USB devices.
# (Alternative: GPIO wiring with firmware env "air" and port /dev/ttyAMA0 after dtparam=uart0=on.)
daq_fs = 2400000

[kraken]
share = "/home/krakenrf/krakensdr_doa/krakensdr_doa/_share"

[transport]
type = "espnow_uart"
port = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5CBB029928-if00"   # shows as /dev/ttyACM0
baud = 460800

[rate]
bytes_per_second = 2500   # ESP-NOW has far more headroom than MAVLink (cap 6250 B/s in code)
doa_hz = 5
spectrum_hz = 1

[commands]
calibration_timeout = 30.0
calib_settle_s = 1.0

[logging]
directory = "/home/krakenrf/krakenlink/logs"
