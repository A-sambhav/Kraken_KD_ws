[platformio]
default_envs = air, ground

[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 460800
build_flags = -I include

[env:air]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DROLE_AIR

[env:ground]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DROLE_GROUND

[env:native]
platform = native
test_framework = unity
build_flags = -I include

; ESP32-S3-N16R8 (16 MB flash, 8 MB octal PSRAM) as the GROUND radio on the laptop.
; Connected through the board's "COM"/UART USB port (WCH CH343 bridge): Serial = UART0 at 460800 baud.
[env:ground_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 460800
build_flags = -I include -DROLE_GROUND -DARDUINO_USB_CDC_ON_BOOT=0

; Same board on its native "USB" port instead (Serial = USB CDC, baud irrelevant).
[env:ground_s3_usb]
extends = env:ground_s3
build_flags = -I include -DROLE_GROUND -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3-N16R8 as the AIR radio, plugged into the Raspberry Pi by its "COM" (CH343 UART) USB port.
; Serial = UART0 at 460800 baud over USB; no GPIO wiring needed.
[env:air_s3]
extends = env:ground_s3
build_flags = -I include -DROLE_AIR -DAIR_HOST_USB -DARDUINO_USB_CDC_ON_BOOT=0
