# Bench config: bridge talks to the Kraken simulator over files and to the ground app over local UDP.
daq_fs = 2400000

[kraken]
share = "bench/share"

[transport]
type = "loopback"
host = "127.0.0.1"
port = 14560
bind_host = "127.0.0.1"
bind_port = 14561

[rate]
bytes_per_second = 625

[commands]
calibration_timeout = 15.0

[logging]
directory = "bench/log"
